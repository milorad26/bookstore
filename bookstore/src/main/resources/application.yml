spring:
  application:
    name: virtual-bookstore

  datasource:
    url: jdbc:h2:file:./data/bookstore
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

server:
  port: 8080

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 900000  # 15 minutes in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds
  issuer: virtual-bookstore

# Stripe Configuration (Test Mode)
stripe:
  api-key: sk_test_51T30mIGnxDQzB041nxkFHJXcMKo7deCubg3CxHwm654LWHMFn938gs4NpZEjBOjUh4ohDdrAEQdpLfKnMxFYR6kV00CtH43ioT
  publishable-key: pk_test_51T30mIGnxDQzB041zdvSBG2pjXiJgnPiP4vL42VStrR7bqXF2DnCE9kwwUxEibfweDpI5sCFT345slmpTTAB90OO00wHze1HEP
