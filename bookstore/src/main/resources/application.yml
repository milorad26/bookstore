spring:
  profiles:
    default: local
  application:
    name: virtual-bookstore

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: ${DATABASE_DRIVER}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  # Mail Configuration
  mail:
    host: localhost
    port: 25
    username: 
    password: 
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    from: orders@bookstore.com

server:
  port: 8080

# Application Configuration
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

inventory:
  low-stock-threshold: ${INVENTORY_LOW_STOCK_THRESHOLD:10}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 900000  # 15 minutes in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
  issuer: virtual-bookstore

# Stripe Configuration (Test Mode)
stripe:
  api-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/orders}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/checkout}

logging:
  level:
    com.bookstore: INFO
    com.bookstore.scheduler: ERROR
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
    org.hibernate.orm.jdbc.bind: ERROR
