spring:
  application:
    name: virtual-bookstore

  datasource:
    url: jdbc:h2:file:./data/bookstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: embedded

server:
  port: 8080

logging:
  level:
    com.bookstore: DEBUG
    org.hibernate.SQL: DEBUG
